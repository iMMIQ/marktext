<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://127.0.0.1:9091 ws://127.0.0.1:9091 https:;"
    >
    <title>MarkText</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }

      #loading-page {
        position: absolute;
        background: transparent;
        -webkit-app-region: drag;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
      }

      .spinner {
        width: 40px;
        height: 40px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
      }

      .double-bounce1, .double-bounce2 {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        opacity: 0.4;
        position: absolute;
        top: 0;
        left: 0;
        -webkit-animation: sk-bounce 2s infinite ease-in-out;
        animation: sk-bounce 2s infinite ease-in-out;
      }

      .double-bounce2 {
        -webkit-animation-delay: -1s;
        animation-delay: -1s;
      }

      @-webkit-keyframes sk-bounce {
        0%, 100% { -webkit-transform: scale(0) }
        50% { -webkit-transform: scale(1) }
      }

      @keyframes sk-bounce {
        0%, 100% {
          transform: scale(0);
          -webkit-transform: scale(0);
        }

        50% {
          transform: scale(1);
          -webkit-transform: scale(1);
        }
      }
    </style>
  </head>
  <body autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="app"></div>

    <div id="loading-page">
      <div class="spinner">
        <div class="double-bounce1 dot"></div>
        <div class="double-bounce2 dot"></div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
