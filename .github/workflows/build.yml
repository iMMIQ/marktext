name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MARKTEXT_EXIT_ON_ERROR: 1

    steps:
      - name: Check out Git repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get install -y \
            bubblewrap dbus-x11 graphicsmagick icnsutils rpm xauth xz-utils xvfb \
            gnome-keyring libfontconfig-dev libsecret-1-dev libx11-dev libxkbfile-dev
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache build downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-build-downloads-v3-${{ hashFiles('bun.lock') }}
          restore-keys: |
            linux-build-downloads-v3-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate build environment
        run: bun run doctor

      - name: Enforce dependency waiting period
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$CHANGE_BASE" || "$CHANGE_BASE" =~ ^0+$ ]]; then
            CHANGE_BASE=HEAD^
          fi
          bun run check:dependency-age --base "$CHANGE_BASE"

      - name: Build native modules and application once
        run: |
          bun run rebuild
          bun run verify:native --platform linux
          bun run pack

      - name: Run non-UI checks
        run: bun run check

      - name: Run desktop-isolated E2E
        run: bun run e2e:runtime

      - name: Verify unpacked application packaging
        run: bun run package:dir

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 14
