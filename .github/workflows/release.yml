name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      stable:
        description: Enforce stable-version metadata
        required: true
        default: false
        type: boolean
      release_ref:
        description: Existing v-prefixed tag to package instead of the selected workflow ref
        required: false
        default: ''
        type: string
      windows_only:
        description: Package Windows after the selected tag has already passed the Linux gate
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: false

jobs:
  stage-linux:
    name: Validate and stage Linux release
    if: ${{ inputs.windows_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MARKTEXT_EXIT_ON_ERROR: 1

    steps:
      - name: Check out Git repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get install -y \
            bubblewrap dbus-x11 graphicsmagick icnsutils rpm xauth xz-utils xvfb \
            gnome-keyring libfontconfig-dev libsecret-1-dev libx11-dev libxkbfile-dev
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache build downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-release-downloads-v3-${{ hashFiles('bun.lock') }}
          restore-keys: |
            linux-release-downloads-v3-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release environment
        run: bun run doctor:release

      - name: Configure release mode
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
          STABLE_REQUESTED: ${{ inputs.stable || false }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v$VERSION"
          REQUESTED_REF="${RELEASE_REF#refs/tags/}"
          if [[ "$REQUESTED_REF" == v* && "$REQUESTED_REF" != "$RELEASE_TAG" ]]; then
            echo "Requested release ref $REQUESTED_REF does not match package version $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if [[ "$STABLE_REQUESTED" == "true" || "$VERSION" != *-* ]]; then
            echo "MARKTEXT_IS_STABLE=1" >> "$GITHUB_ENV"
          else
            echo "MARKTEXT_IS_STABLE=" >> "$GITHUB_ENV"
          fi

      - name: Validate release inputs
        run: |
          DEPENDENCY_BASE=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD^)
          bun run check:dependency-age --base "$DEPENDENCY_BASE"
          if [[ "$MARKTEXT_IS_STABLE" == "1" ]]; then
            GITHUB_REF_NAME="$RELEASE_TAG" bun run check:release-state --stable
          else
            GITHUB_REF_NAME="$RELEASE_TAG" bun run check:release-state
          fi

      - name: Build native modules and application once
        run: |
          bun run rebuild
          bun run verify:native --platform linux
          bun run pack

      - name: Run release quality gate
        run: |
          bun run check
          bun run e2e:runtime

      - name: Package Linux artifacts
        run: bun run package:linux

      - name: Generate artifact checksums
        run: bun run release:checksums

      - name: Upload Linux release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: marktext-linux-${{ inputs.release_ref || github.ref_name }}
          path: |
            build/*.AppImage
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/latest*.yml
            build/*.blockmap
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload source maps separately
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: marktext-source-maps-${{ inputs.release_ref || github.ref_name }}
          path: dist/electron/**/*.map
          if-no-files-found: error
          retention-days: 14

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-e2e-diagnostics-${{ github.run_id }}
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 14

  stage-windows:
    name: Stage Windows x64 release
    needs: stage-linux
    if: ${{ always() && needs.stage-linux.result != 'failure' && needs.stage-linux.result != 'cancelled' }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      MARKTEXT_EXIT_ON_ERROR: 1

    steps:
      - name: Check out release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache build downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\cache
          key: windows-release-downloads-v1-${{ hashFiles('bun.lock') }}
          restore-keys: |
            windows-release-downloads-v1-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate selected tag and configure release mode
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
          STABLE_REQUESTED: ${{ inputs.stable || false }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $releaseTag = "v$version"
          $requestedRef = $env:RELEASE_REF -replace '^refs/tags/', ''
          if ($requestedRef -ne $releaseTag) {
            throw "Requested release ref $requestedRef does not match package version $releaseTag"
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($env:STABLE_REQUESTED -eq 'true' -or $version -notmatch '-') {
            "MARKTEXT_IS_STABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "MARKTEXT_IS_STABLE=" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Validate release metadata
        shell: pwsh
        run: |
          $env:GITHUB_REF_NAME = $env:RELEASE_TAG
          if ($env:MARKTEXT_IS_STABLE -eq '1') {
            bun run check:release-state --stable
          } else {
            bun run check:release-state
          }

      - name: Build Windows native modules and application
        run: |
          bun run rebuild
          bun run verify:native --platform win32
          bun run pack

      - name: Package Windows x64 artifacts
        run: bun run package:win --x64

      - name: Generate artifact checksums
        run: bun run release:checksums

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: marktext-windows-${{ inputs.release_ref || github.ref_name }}
          path: |
            build/*.exe
            build/*-win.zip
            build/*.blockmap
            build/latest*.yml
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
