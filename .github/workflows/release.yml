name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      stable:
        description: Enforce stable-version metadata
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-linux:
    name: Validate and stage Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MARKTEXT_EXIT_ON_ERROR: 1

    steps:
      - name: Check out Git repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get install -y \
            bubblewrap dbus-x11 graphicsmagick icnsutils rpm xauth xz-utils xvfb \
            gnome-keyring libfontconfig-dev libsecret-1-dev libx11-dev libxkbfile-dev

      - name: Cache build downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-release-downloads-v3-${{ hashFiles('bun.lock') }}
          restore-keys: |
            linux-release-downloads-v3-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release environment
        run: bun run doctor:release

      - name: Configure release mode
        env:
          STABLE_REQUESTED: ${{ inputs.stable || false }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$STABLE_REQUESTED" == "true" || "$VERSION" != *-* ]]; then
            echo "MARKTEXT_IS_STABLE=1" >> "$GITHUB_ENV"
          else
            echo "MARKTEXT_IS_STABLE=" >> "$GITHUB_ENV"
          fi

      - name: Validate release inputs
        run: |
          DEPENDENCY_BASE=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD^)
          bun run check:dependency-age --base "$DEPENDENCY_BASE"
          if [[ "$MARKTEXT_IS_STABLE" == "1" ]]; then
            bun run check:release-state --stable
          else
            bun run check:release-state
          fi

      - name: Build native modules and application once
        run: |
          bun run rebuild
          bun run verify:native --platform linux
          bun run pack

      - name: Run release quality gate
        run: |
          bun run check
          bun run e2e:runtime

      - name: Package Linux artifacts
        run: bun run package:linux

      - name: Generate artifact checksums
        run: bun run release:checksums

      - name: Upload Linux release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: marktext-linux-${{ github.ref_name }}
          path: |
            build/*.AppImage
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/latest*.yml
            build/*.blockmap
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload source maps separately
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: marktext-source-maps-${{ github.ref_name }}
          path: dist/electron/**/*.map
          if-no-files-found: error
          retention-days: 14

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-e2e-diagnostics-${{ github.run_id }}
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 14
